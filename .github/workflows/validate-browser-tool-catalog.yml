name: Validate Browser Tool Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-browser-tool-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          install: false

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Test site builder and catalog
        run: pnpm run test

      - name: Build catalog and all browser tools
        run: pnpm run build
