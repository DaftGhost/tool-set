name: Deploy LLM API Cost Calculator to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/llm-api-cost-calculator
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: tools/llm-api-cost-calculator/.nvmrc
          cache: npm
          cache-dependency-path: tools/llm-api-cost-calculator/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tools/llm-api-cost-calculator

      - name: Build app
        run: npm run build
        working-directory: tools/llm-api-cost-calculator

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: tools/llm-api-cost-calculator/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
